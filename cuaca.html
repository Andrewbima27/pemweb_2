<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      .form-control {
        padding: 5px;
        width: 200px;
        margin-right: 10px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }
      button {
        padding: 5px 10px;
        border: none;
        border-radius: 3px;
        background-color: #28a745;
        color: white;
        cursor: pointer;
      }
      button:hover {
        background-color: #218838;
      }
      #hasil {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h1>My Weather App</h1>
    <p>Web Pengecek Cuaca</p>

    <input
      class="form-control"
      type="text"
      id="kota"
      placeholder="Masukan nama Kota"
    />
    <button onclick="ambilCuaca()">Lihat Cuaca</button>
  </body>
  <div id="hasil"></div>
  <script>
    const apiKey = "32aae1007d5589c48c7a515cb1f60434";

    function ambilCuaca() {
      const namaKota = document.getElementById("kota").value;
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${namaKota}&appid=${apiKey}&lang=id&units=metric`;

      fetch(url)
        .then((response) => {
          if (!response.ok) {
            throw new Error("Kota tidak ditemukan");
          }
          return response.json();
        })
        .then((data) => {
          const suhu = data.main.temp;
          const cuaca = data.weather[0].description;
          const kelembaban = data.main.humidity;
          const nama = data.name;
          const negara = data.sys.country;
          const kordinat = `Lat: ${data.coord.lat}, Lon: ${data.coord.lon}`;

          document.getElementById("hasil").innerHTML =
            `<h3>Cuaca di ${nama}</h3>
            <p>Suhu: ${suhu}°C</p>
            <p>Cuaca: ${cuaca}</p>
            <p>Kelembaban: ${kelembaban}%</p>
            <p>Negara: ${negara}</p>
            <p>Kordinat: ${kordinat}</p>`;
        })
        .catch((error) => {
          document.getElementById("hasil").innerHTML =
            `<p style="color:red">${error.message}</p>`;
        });
    }
  </script>
</html>
