<!doctype html>
<html>
  <style>
    body {
      background: #f0f0f0;
      padding: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background: #0056b3;
    }
    #lokasi,
    #ip {
      margin-top: 20px;
      font-size: 18px;
    }
    iframe {
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
  <body style="text-align: center; font-family: sans-serif">
    <h2>
      Mengambil data Geolokasi dengan API Google Map dan Alamat IP Perangkat
      Kita
    </h2>

    <blockquote>
      Mengambil data Geolokasi kordinat dan get DOM API maps.google.com untuk
      menampilkan peta dan Get Alamat IP Perangkat Kita dari API ipify.org
    </blockquote>

    <p>
      Klik tombol untuk melihat lokasi di peta dan alamat IP perangkat kamu.
    </p>
    <button onclick="getLocation()">
      Klik untuk mendapatkan titik kordinat dan IP perangkat
    </button>

    <p id="lokasi"></p>
    <p id="ip"></p>
    <div id="map" style="width: 100%; height: 400px"></div>

    <script>
      const lokasi = document.getElementById("lokasi");
      const ip = document.getElementById("ip");
      const map = document.getElementById("map");

      function getLocation() {
        if (!navigator.geolocation) {
          lokasi.innerText = "Browser tidak mendukung geolokasi.";
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            lokasi.innerHTML = `Latitude: ${lat}<br>Longitude: ${lon}`;
            map.innerHTML = `<iframe width="50%" height="400" 
          src="https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed" 
          frameborder="0" allowfullscreen></iframe>`;
          },
          () => {
            lokasi.innerText = "Tidak bisa mengambil lokasi.";
          },
        );

        // Ambil IP
        fetch("https://api.ipify.org?format=json")
          .then((res) => res.json())
          .then((data) => (ip.innerText = "IP Anda: " + data.ip))
          .catch(() => (ip.innerText = "Gagal mengambil IP."));
      }
    </script>
  </body>
</html>
